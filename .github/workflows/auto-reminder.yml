name: Hourly auto-reminder (deprecated)

# DEPRECATED (25/8/2026): "Nhắc chấm công tự động hàng ngày" (giờ cố định + chọn ngày thủ công)
# đã được gộp vào "Nhắc chấm công trước & trễ giờ vào ca" (xem components/settings/LateReminderPanel.tsx
# + lib/lateReminder.ts runPreShiftReminders, chạy trong .github/workflows/late-reminder.yml).
# Tắt lịch chạy tự động ở đây để khỏi gọi API đã ẩn khỏi UI; giữ workflow_dispatch phòng khi cần
# đối chiếu/rollback. File này + app/api/cron/auto-reminder, app/api/company/auto-reminder,
# components/settings/AutoReminderPanel.tsx có thể xoá hẳn sau khi đã yên tâm không còn cần nữa.

on:
  workflow_dispatch: {} # chỉ chạy khi bấm tay — KHÔNG còn lịch tự động

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto-reminder endpoint
        run: |
          curl -fsS -X GET "https://timio.vn/api/cron/auto-reminder" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
